name: .NET CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dotnet-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore BookNexusAPI.slnx

      - name: Build
        run: dotnet build BookNexusAPI.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test BookNexusAPI.slnx --configuration Release --no-build --verbosity normal
